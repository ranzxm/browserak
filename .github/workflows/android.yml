name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_check:
        description: 'Capture Android UI screenshots on GitHub runner'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check, lint, build
        run: gradle --no-daemon :app:check :app:assembleDebug :app:assembleRelease
      - name: APK size
        run: |
          du -h app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          bytes=$(stat -c%s app/build/outputs/apk/release/*-unsigned.apk)
          echo "Release APK: $bytes bytes (limit 5 MiB)" >> "$GITHUB_STEP_SUMMARY"
          test "$bytes" -le 5242880
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserak-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: browserak-release-unsigned
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            app/build/reports/
            app/build/test-results/
  ui-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.visual_check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: browserak-debug-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb install apk/app-debug.apk
            adb shell am start -n com.ranzxm.browserak/.MainActivity
            sleep 8
            adb shell input keyevent 4
            sleep 2
            adb shell am start -n com.ranzxm.browserak/.MainActivity
            sleep 3
            adb shell screencap -p /sdcard/home.png
            adb pull /sdcard/home.png screenshots/home.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml screenshots/window.xml
            python3 -c 'import re,subprocess,xml.etree.ElementTree as E; n=next(n for n in E.parse("screenshots/window.xml").iter("node") if n.get("content-desc")=="Menu browser"); x1,y1,x2,y2=map(int,re.findall(r"\d+",n.get("bounds"))); subprocess.run(["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],check=True)'
            sleep 2
            adb shell uiautomator dump /sdcard/menu.xml
            adb pull /sdcard/menu.xml screenshots/menu.xml
            python3 -c 'import xml.etree.ElementTree as E; assert any(n.get("content-desc")=="Perbarui filter" for n in E.parse("screenshots/menu.xml").iter("node")), "Menu panel did not open"'
            adb shell screencap -p /sdcard/menu.png
            adb pull /sdcard/menu.png screenshots/menu.png
            adb logcat -d -s AndroidRuntime:E > screenshots/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: screenshots/
